name: Sync Servermatik mirror

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: servermatik-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure mirror remote
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MIRROR_TOKEN"
          git remote add mirror \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/Servermatik-devs/diskmize.git"

      - name: Sync main branch
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: git push mirror HEAD:main

      - name: Sync tags
        run: git push mirror --tags
